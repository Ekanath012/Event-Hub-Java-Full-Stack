spring.application.name=eventhub-backend
# Load the project .env automatically (works from backend/ or project root); real OS env vars still take precedence.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:eventhub_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:eventhub}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.flyway.enabled=true
app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:8080}
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:15}
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
management.endpoints.web.exposure.include=health,info
# Keep the mail health probe disabled when outgoing email is disabled.
management.health.mail.enabled=${MAIL_ENABLED:false}

app.jwt.access-token-expiration-seconds=${JWT_ACCESS_EXPIRATION:900}
app.jwt.refresh-token-expiration-seconds=${JWT_REFRESH_EXPIRATION:604800}
app.security.max-failed-logins=${MAX_FAILED_LOGINS:5}
app.security.lockout-minutes=${LOCKOUT_MINUTES:15}
app.rate-limit.auth.max-requests=${AUTH_RATE_LIMIT_MAX:10}
app.rate-limit.auth.window-seconds=${AUTH_RATE_LIMIT_WINDOW:60}
app.cookie.secure=${COOKIE_SECURE:false}
